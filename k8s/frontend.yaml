# frontend.yaml
# Déploie le frontend statique TaskBoard (HTML/CSS/JS servi par 'serve') avec :
#   - Deployment  : 1 replica, image locale, port 8080
#   - Service     : NodePort pour accès direct depuis le navigateur sur Docker Desktop
#
# Image à builder avant de déployer :
#   docker build -t taskboard-frontend:latest ./taskboard/frontend
#
# Accès direct (sans Ingress) :
#   kubectl port-forward -n taskboard svc/taskboard-frontend 8080:8080
#   Puis ouvrir http://localhost:8080
#
# URL de l'API : gérée côté code dans app.js (window.API_BASE_URL || "/api").
# Avec l'Ingress, le frontend appelle /api sur la MÊME origine (taskboard.local),
# routé vers le Service taskboard-backend:3000. Aucune variable d'env n'est requise
# côté conteneur (le JS s'exécute dans le navigateur, pas dans le pod).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-frontend
  namespace: taskboard
  labels:
    app: taskboard
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskboard
      component: frontend
  template:
    metadata:
      labels:
        app: taskboard
        component: frontend
    spec:
      containers:
        - name: frontend
          image: taskboard-frontend:latest
          # IfNotPresent : utilise l'image buildée localement sur Docker Desktop
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # NB : pas de variable d'environnement pour l'URL de l'API.
          # Ce frontend est un site STATIQUE (servi par `serve`) : une variable d'env
          # de conteneur n'atteint JAMAIS le JavaScript exécuté dans le navigateur.
          # L'URL est résolue côté code par app.js (`window.API_BASE_URL || "/api"`)
          # et /api est routé vers le backend par l'Ingress (même origine, rewrite /api → /).
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
# Service NodePort : permet d'accéder au frontend depuis le navigateur sur Docker Desktop
# Le NodePort est assigné automatiquement par Kubernetes (30000-32767)
apiVersion: v1
kind: Service
metadata:
  name: taskboard-frontend
  namespace: taskboard
  labels:
    app: taskboard
    component: frontend
spec:
  type: NodePort
  selector:
    app: taskboard
    component: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      # nodePort non fixé : Kubernetes assigne automatiquement un port libre
